[package]
name = "geode-finder"
version = "2.3.1"
edition = "2024"
description = "Tool to search for geodes and budding amethyst clusters in a Minecraft world"
repository = "https://github.com/soulsoiledit/geode-finder"
license = "MIT"
keywords = ["minecraft", "amethyst", "geode", "finder", "search"]
categories = ["command-line-utilities"]

[lints.clippy]
cargo_common_metadata = "warn"

# require documentation of allow rules
allow_attributes = "warn"
allow_attributes_without_reason = "warn"

# require documentation for panics
missing_assert_message = "warn"
unwrap_used = "deny"

# avoid consuming errors
unused_result_ok = "warn"

# this just annoys me
semicolon_if_nothing_returned = "warn"
unnecessary_semicolon = "warn"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.4", features = ["derive"] }
indicatif = "0.18.6"
multiversion = "0.8.0"
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
