name: geode-finder

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    tags:
      - "v*.*.*"
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always

jobs:
  draft-release:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Draft release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
  build:
    strategy:
      matrix:
        include:
          - name: geode-finder
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            ext: ''
          - name: geode-finder-mac
            os: macos-latest
            target: aarch64-apple-darwin
            ext: ''
          - name: geode-finder.exe
            os: windows-latest
            target: x86_64-pc-windows-gnu
            ext: '.exe'
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --target ${{ matrix.target }} --release --verbose
      - name: Run tests
        run: cargo test --target ${{ matrix.target }} --verbose
      - name: Rename binary
        shell: bash
        run: cp target/${{ matrix.target }}/release/geode-finder${{ matrix.ext }} ${{ matrix.name }}
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}

      - name: Attach release asset
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: ${{ matrix.name }}
